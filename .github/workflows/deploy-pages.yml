name: Publicar Biblioteca Be Safe

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/deploy-pages.yml"
      - "library.zip.part-*"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar os arquivos do repositório
        uses: actions/checkout@v6

      - name: Reunir e conferir a biblioteca
        shell: bash
        run: |
          test "$(find . -maxdepth 1 -type f -name 'library.zip.part-*' | wc -l)" -eq 18
          cat library.zip.part-* > biblioteca.zip
          echo "656d7964b345efe323b2f4ec4bc5a4383e563bf33e30f4a5edff77e1159277fd  biblioteca.zip" | sha256sum -c -
          unzip -q biblioteca.zip
          test -f Biblioteca_Be_Safe/index.html
          test "$(find Biblioteca_Be_Safe/pdfs -maxdepth 1 -type f -name '*.pdf' | wc -l)" -eq 82
          test "$(find Biblioteca_Be_Safe/covers -maxdepth 1 -type f -name '*.jpg' | wc -l)" -eq 82
      - name: Atualizar Portal Principal
        run: sed -i 's|https://marianabsctba.github.io/|https://marianabsctba.github.io/Be_Safe_Academy/|' Biblioteca_Be_Safe/index.html

      - name: Adicionar livro e responsividade mobile
        shell: python
        run: |
          from pathlib import Path

          path = Path("Biblioteca_Be_Safe/index.html")
          html = path.read_text(encoding="utf-8")

          book_url = "https://www.amazon.com.br/Pequenos-Guardi%C3%B5es-Internet-Infantil-Ciberseguran%C3%A7a-ebook/dp/B0GPLVC6D1"
          book_markup = f"""
            <a class="book-link" href="{book_url}" target="_blank" rel="noreferrer">
              <span>LIVRO INFANTIL</span>
              <strong>PEQUENOS GUARDIÕES DA INTERNET</strong>
              <b>VER NA AMAZON ↗</b>
            </a>
          """

          mobile_css = """
            /* BE SAFE LIBRARY MOBILE FIX — 2026-08-16 */
            .book-link {
              margin-bottom: 17px;
              padding: 20px;
              display: grid;
              grid-template-columns: auto 1fr auto;
              align-items: center;
              gap: 18px;
              border: 1px solid var(--pink);
              background: rgba(255, 61, 152, 0.08);
            }
            .book-link span {
              color: var(--pink);
              font: 500 9px "DM Mono", monospace;
              letter-spacing: .08em;
            }
            .book-link strong {
              min-width: 0;
              font-size: 17px;
              letter-spacing: -.03em;
            }
            .book-link b {
              padding: 9px 11px;
              border: 1px solid var(--paper);
              font: 500 9px "DM Mono", monospace;
              letter-spacing: .06em;
              white-space: nowrap;
            }
            @media(max-width:760px) {
              html, body {
                width: 100%;
                max-width: 100%;
                overflow-x: hidden;
              }
              .nav {
                min-height: auto;
                padding: 12px 16px;
                flex-wrap: wrap;
                gap: 10px;
              }
              .brand {
                min-width: 0;
                font-size: 18px;
              }
              .brand i {
                margin-left: 6px;
                font-size: 8px;
              }
              .nav a:last-child {
                padding: 8px 9px;
                font-size: 8px;
                white-space: nowrap;
              }
              .hero {
                width: 100%;
                padding: 56px 16px 50px;
              }
              .eyebrow {
                font-size: 8px;
                line-height: 1.5;
                letter-spacing: .08em;
              }
              h1 {
                max-width: 100%;
                font-size: clamp(43px, 16vw, 72px);
                line-height: .84;
                overflow-wrap: anywhere;
              }
              .hero-bottom {
                margin-top: 36px;
                gap: 30px;
              }
              .stats {
                grid-template-columns: 1fr;
                gap: 16px;
              }
              .catalog {
                width: 100%;
                padding: 50px 14px 80px;
              }
              .book-link {
                grid-template-columns: 1fr;
                gap: 8px;
                padding: 18px;
              }
              .book-link b {
                justify-self: start;
                white-space: normal;
              }
              .search {
                min-height: 62px;
                padding: 0 12px;
                gap: 10px;
              }
              .filters {
                flex-wrap: nowrap;
                overflow-x: auto;
                padding-bottom: 8px;
                scrollbar-width: thin;
              }
              .filters button {
                flex: 0 0 auto;
              }
              .grid {
                grid-template-columns: 1fr;
              }
              .meta,
              .card-actions,
              .viewer-actions {
                flex-wrap: wrap;
              }
              .card-body {
                min-width: 0;
                padding: 20px;
              }
              .viewer-bar {
                max-height: 42vh;
                overflow-y: auto;
              }
              iframe {
                height: 58vh;
              }
              footer {
                padding: 42px 16px;
              }
            }
            @media(max-width:380px) {
              .brand i {
                display: none;
              }
              h1 {
                font-size: 40px;
              }
              .search input {
                font-size: 9px;
                letter-spacing: .02em;
              }
            }
          """

          if 'class="book-link"' not in html:
              html = html.replace('<main class="catalog">', '<main class="catalog">\n' + book_markup, 1)

          if "BE SAFE LIBRARY MOBILE FIX" not in html:
              html = html.replace("</style>", mobile_css + "\n  </style>", 1)

          path.write_text(html, encoding="utf-8")

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6

      - name: Preparar o site
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ./Biblioteca_Be_Safe

      - name: Publicar o site
        id: deployment
        uses: actions/deploy-pages@v5.0.0
